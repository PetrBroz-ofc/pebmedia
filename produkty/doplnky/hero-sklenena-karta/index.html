<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ukázka — Hero sekce se skleněnou kartou</title>
<link rel="stylesheet" href="styl.css">
</head>
<body>

  <!-- ===== HERO SE SKLENĚNOU KARTOU — začátek komponenty ===== -->
  <section class="hsk-hero">
    <div class="hsk-bg" aria-hidden="true"></div>

    <div class="hsk-card">
      <p class="hsk-eyebrow">Vítejte</p>
      <h1 class="hsk-title">Nadpis, který upoutá pozornost</h1>
      <p class="hsk-text">
        Krátký popisný text pod nadpisem. Vysvětlete ve dvou větách, čím je vaše
        nabídka výjimečná a proč by měl návštěvník pokračovat dál.
      </p>
      <div class="hsk-actions">
        <a href="#" class="hsk-btn hsk-btn-primary">Hlavní tlačítko</a>
        <a href="#" class="hsk-btn hsk-btn-ghost">Zjistit více</a>
      </div>
    </div>
  </section>
  <!-- ===== HERO SE SKLENĚNOU KARTOU — konec komponenty ===== -->

  <main class="hsk-demo-content">
    <p>Obsah pod hero sekcí slouží jen pro ukázku kontextu — samotná komponenta je blok výše.</p>
  </main>

</body>
</html>

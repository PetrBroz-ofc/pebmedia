<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ukázka — Tlačítka a odznaky</title>
<link rel="stylesheet" href="styl.css">
</head>
<body>
<main class="ta-demo">
  <h1>Tlačítka a odznaky</h1>

  <!-- ===== TLAČÍTKA A ODZNAKY — začátek komponenty ===== -->
  <section class="ta-group">
    <h2>Tlačítka</h2>
    <div class="ta-row">
      <button class="ta-btn ta-btn-primary">Primární</button>
      <button class="ta-btn ta-btn-secondary">Sekundární</button>
      <button class="ta-btn ta-btn-outline">Obrysové</button>
      <button class="ta-btn ta-btn-ghost">Ghost</button>
      <button class="ta-btn ta-btn-danger">Nebezpečná akce</button>
    </div>
    <div class="ta-row">
      <button class="ta-btn ta-btn-primary" disabled>Primární (disabled)</button>
      <button class="ta-btn ta-btn-primary ta-btn-sm">Malé</button>
      <button class="ta-btn ta-btn-primary ta-btn-lg">Velké</button>
    </div>
  </section>

  <section class="ta-group">
    <h2>Odznaky (badges)</h2>
    <div class="ta-row">
      <span class="ta-badge ta-badge-neutral">Výchozí</span>
      <span class="ta-badge ta-badge-success">Aktivní</span>
      <span class="ta-badge ta-badge-warning">Čeká se</span>
      <span class="ta-badge ta-badge-danger">Neaktivní</span>
      <span class="ta-badge ta-badge-accent">Novinka</span>
      <span class="ta-badge ta-badge-outline">Sleva -20 %</span>
    </div>
  </section>
  <!-- ===== TLAČÍTKA A ODZNAKY — konec komponenty ===== -->

</main>
</body>
</html>
